[tool.poetry]
name = "biochatter-light"
version = "0.8.5"
description = "The light frontend for BioChatter, in pure Python"
authors = ["Sebastian Lobentanzer <sebastian.lobentanzer@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
streamlit = "^1.21.0"
pandas = "^2.2.3"
numpy = "^2.1.3"
loguru = "^0.7.0"
biochatter = "^0.10.0"
tabulate = "^0.9.0"
neo4j-utils = { version = "^0.0.12", optional = true }
[tool.poetry.extras]
neo4j = ["neo4j-utils"]

[tool.poetry.group.dev.dependencies]
bump2version = "^1.0.1"
ruff = "^0.11.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.per-file-ignores]
"test/*" = ["ANN001", "ANN201", "D100", "D101", "D102", "D103", "D104", "I001", "S101"]
"benchmark/*" = ["ANN001", "ANN201", "D100", "D101", "D102", "D103", "D104", "I001", "S101"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false